aid: startengine
name: StartEngine
description: >-
  StartEngine is a Los Angeles based online private-market investment platform that lets everyday
  investors buy equity in startups and pre-IPO companies, and lets founders raise capital under
  Regulation Crowdfunding, Regulation A+ and Regulation D. The company operates StartEngine Capital,
  its FINRA-registered funding portal; StartEngine Private, a fund vehicle for later-stage pre-IPO
  companies; a secondary marketplace for trading eligible private shares; and StartEngine Secure, an
  SEC-registered transfer agent and cap-table management service sold to issuers on a published
  monthly plan. StartEngine publishes no public developer API, SDK, webhook catalog or developer
  portal - its public engineering output is an internal design-system npm scope, agent examples, and
  Ethereum security-token standards work (the ERC-1450 reference implementation).
